<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Moj Džep — lične finansije</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%9B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
    --paper:#ECE5D6;
    --paper-2:#F7F2E7;
    --ink:#2A2721;
    --ink-soft:#6B6255;
    --accent:#1E5F5B;
    --accent-contrast:#FFFFFF;
    --income:#3F6B4E;
    --expense:#A24B36;
    --line:#D9CFB8;
    --warn:#C97B2E;
    --danger:#A24B36;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1E1C18;
      --paper-2:#26231D;
      --ink:#EDE6D6;
      --ink-soft:#A79C87;
      --accent:#4FA39D;
      --accent-contrast:#0E1614;
      --income:#6FAE83;
      --expense:#D08064;
      --line:#3A362D;
      --warn:#E0A054;
      --danger:#D08064;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1E1C18;
    --paper-2:#26231D;
    --ink:#EDE6D6;
    --ink-soft:#A79C87;
    --accent:#4FA39D;
    --accent-contrast:#0E1614;
    --income:#6FAE83;
    --expense:#D08064;
    --line:#3A362D;
    --warn:#E0A054;
    --danger:#D08064;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-mono);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button, input, select{ font-family:var(--font-mono); }
  .hidden{ display:none!important; }

  .app-header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--paper-2); border-bottom:1px solid var(--line);
    padding:.9rem 1rem .7rem;
  }
  .app-header h1{ font-family:var(--font-display); font-size:1.5rem; margin:0 0 .15rem; font-weight:600; }
  .app-header p{ margin:0; font-size:.78rem; color:var(--ink-soft); }

  .tabbar{
    display:flex; gap:.4rem; overflow-x:auto; padding:.6rem 1rem 0;
    background:var(--paper-2); border-bottom:1px solid var(--line); scrollbar-width:thin;
  }
  .tab-btn{
    flex:0 0 auto; font-size:.78rem; padding:.5rem .8rem; border:1px solid var(--line);
    border-bottom:none; border-radius:10px 10px 0 0; background:var(--paper); color:var(--ink-soft); cursor:pointer;
  }
  .tab-btn.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); font-weight:600; }

  .main{ padding:1rem 1rem 6rem; max-width:640px; margin:0 auto; }

  .pocket-row{ display:flex; gap:.7rem; margin-bottom:1.1rem; }
  .pocket{ flex:1; min-width:0; background:var(--paper-2); border:1.5px dashed var(--line); border-radius:16px; padding:.9rem 1rem; }
  .pocket-label{ font-size:.72rem; color:var(--ink-soft); margin-bottom:.3rem; }
  .pocket-amount{ font-family:var(--font-display); font-size:1.5rem; font-weight:600; line-height:1.15; word-break:break-word; }
  .pocket-amount.negative{ color:var(--expense); }

  .section-title{ font-family:var(--font-display); font-size:1.1rem; font-weight:600; margin:1.3rem 0 .6rem; }
  .card{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:.9rem; margin-bottom:.7rem; }

  .btn{ font-size:.85rem; padding:.65rem 1rem; border-radius:9px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-contrast); cursor:pointer; }
  .btn:active{ transform:translateY(1px); }
  .btn-secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn-block{ width:100%; display:block; text-align:center; }
  .btn-sm{ padding:.4rem .7rem; font-size:.78rem; border-radius:7px; }

  .form-group{ margin-bottom:.85rem; }
  .form-group label{ display:block; font-size:.75rem; color:var(--ink-soft); margin-bottom:.3rem; }
  .form-group input, .form-group select{
    width:100%; padding:.6rem .65rem; border:1px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--ink); font-size:.9rem;
  }
  .form-group input[type="checkbox"]{ width:auto; padding:0; vertical-align:middle; margin-right:.4rem; }
  .form-group input:focus-visible, .form-group select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .seg{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button{ flex:1; padding:.55rem 0; background:var(--paper); border:none; color:var(--ink-soft); font-size:.85rem; cursor:pointer; }
  .seg button.active.income{ background:var(--income); color:#fff; }
  .seg button.active.expense{ background:var(--expense); color:#fff; }

  .row{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; padding:.6rem 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row-main{ min-width:0; flex:1; }
  .row-title{ font-size:.88rem; }
  .row-sub{ font-size:.72rem; color:var(--ink-soft); margin-top:.15rem; }
  .row-end{ display:flex; align-items:center; gap:.5rem; flex-shrink:0; }
  .amt{ font-weight:600; white-space:nowrap; font-size:.9rem; }
  .amt.income{ color:var(--income); }
  .amt.expense{ color:var(--expense); }
  .row-actions{ display:flex; gap:.3rem; flex-shrink:0; }
  .icon-btn{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:.95rem; padding:.2rem .3rem; }

  .progress-track{ background:var(--line); border-radius:6px; height:8px; overflow:hidden; margin:.4rem 0; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .3s ease; }
  .progress-fill.warn{ background:var(--warn); }
  .progress-fill.over{ background:var(--danger); }

  .bar-row{ margin-bottom:.6rem; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-row-top{ display:flex; justify-content:space-between; font-size:.78rem; margin-bottom:.25rem; gap:.5rem; }
  .bar-track{ background:var(--line); border-radius:6px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); transition:width .3s ease; }

  .badge{ font-size:.68rem; padding:.25rem .55rem; border-radius:20px; white-space:nowrap; }
  .badge.overdue{ background:var(--danger); color:#fff; }
  .badge.soon{ background:var(--warn); color:#1a1a1a; }
  .badge.upcoming{ background:var(--line); color:var(--ink-soft); }
  .badge.paid{ background:var(--income); color:#fff; }

  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.7rem; }
  .month-nav button{ background:none; border:none; color:var(--ink); font-size:1.2rem; cursor:pointer; padding:.2rem .6rem; }
  .month-nav .label{ font-family:var(--font-display); font-weight:600; }
  .cur-toggle{ display:flex; gap:.4rem; margin-bottom:.6rem; }
  .cur-toggle button{ font-size:.78rem; padding:.35rem .8rem; border-radius:20px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; }
  .cur-toggle button.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
  .stat-row{ display:flex; gap:.6rem; margin-bottom:.8rem; }
  .stat{ flex:1; min-width:0; background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:.6rem .7rem; }
  .stat .k{ font-size:.7rem; color:var(--ink-soft); }
  .stat .v{ font-family:var(--font-display); font-size:1.05rem; font-weight:600; margin-top:.15rem; word-break:break-word; }

  .filters{ display:flex; gap:.5rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .filters select{ font-size:.78rem; padding:.45rem .5rem; border:1px solid var(--line); border-radius:8px; background:var(--paper-2); color:var(--ink); }
  .filters input[type="text"]{ flex:1; min-width:120px; font-size:.78rem; padding:.45rem .5rem; border:1px solid var(--line); border-radius:8px; background:var(--paper-2); color:var(--ink); }

  .chips{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem; }
  .chip{ display:flex; align-items:center; gap:.35rem; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:.25rem .6rem; font-size:.75rem; }
  .chip button{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:.8rem; padding:0; }

  .empty{ text-align:center; color:var(--ink-soft); padding:1.6rem 1rem; font-size:.85rem; }

  .fab{
    position:fixed; right:1.1rem; bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
    border:none; font-size:1.7rem; box-shadow:0 4px 14px rgba(0,0,0,.28); cursor:pointer; z-index:50;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:100; padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .modal{
    background:var(--paper); width:100%; max-width:480px; border-radius:18px 18px 0 0;
    padding:1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;
  }
  @media (min-width:560px){ .modal-overlay{ align-items:center; } .modal{ border-radius:18px; } }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:.8rem; gap:.5rem; }
  .modal-header h3{ font-family:var(--font-display); margin:0; font-size:1.15rem; }

  .toast{
    position:fixed; left:50%; bottom:calc(5.5rem + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px);
    background:var(--ink); color:var(--paper); padding:.6rem 1rem; border-radius:10px; font-size:.82rem;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:200; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>👛 Moj Džep</h1>
    <p>Lični pregled prihoda, rashoda i štednje</p>
  </header>
  <nav class="tabbar" id="tabbar"></nav>
  <main class="main" id="tabContent"></main>
  <button class="fab" id="fabBtn" title="Dodaj transakciju">+</button>
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" id="modalCloseBtn" title="Zatvori">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  'use strict';

  var STORAGE_KEY = 'dzep_v1';

  var DEFAULT_EXPENSE_CATS = ['🍽️ Hrana','🚌 Prevoz','🏠 Stanovanje','🧾 Računi','💊 Zdravlje','🎉 Zabava','👕 Odeća','📚 Obrazovanje','✈️ Putovanja','💰 Štednja','🔹 Ostalo'];
  var DEFAULT_INCOME_CATS = ['💼 Plata','💵 Bonus','🧑\u200d💻 Honorar','🎁 Poklon','📈 Investicije','💰 Štednja','🔹 Ostalo'];

  var TABS = [
    {id:'pregled', label:'Pregled'},
    {id:'transakcije', label:'Transakcije'},
    {id:'budzet', label:'Budžet'},
    {id:'ciljevi', label:'Ciljevi'},
    {id:'racuni', label:'Računi'},
    {id:'podesavanja', label:'Podešavanja'}
  ];

  function defaultState(){
    return {
      version:1,
      transactions:[],
      categories:{ income:DEFAULT_INCOME_CATS.slice(), expense:DEFAULT_EXPENSE_CATS.slice() },
      budgets:[],
      goals:[],
      bills:[],
      settings:{ eurRate:117 }
    };
  }

  function mergeMissingDefaults(list, defaults){
    defaults.forEach(function(c){
      if(list.indexOf(c) === -1){
        var idx = list.indexOf('🔹 Ostalo');
        if(idx === -1) list.push(c); else list.splice(idx, 0, c);
      }
    });
    return list;
  }

  // Everything is tracked in RSD internally. Any record still flagged EUR
  // (from before this feature existed) gets converted once, and the original
  // EUR figure is preserved for reference so nothing is silently lost.
  function migrateToRSD(d, rate){
    d.transactions.forEach(function(t){
      if(t.currency === 'EUR'){
        if(t.originalAmount === undefined){ t.originalAmount = t.amount; t.originalCurrency = 'EUR'; }
        t.amount = t.amount * rate;
        t.currency = 'RSD';
      }
    });
    d.budgets.forEach(function(b){
      if(b.currency === 'EUR'){
        if(b.originalLimit === undefined){ b.originalLimit = b.limit; b.originalCurrency = 'EUR'; }
        b.limit = b.limit * rate;
        b.currency = 'RSD';
      }
    });
    d.goals.forEach(function(g){
      if(g.currency === 'EUR'){
        if(g.originalTarget === undefined){ g.originalTarget = g.target; g.originalCurrency = 'EUR'; }
        g.target = g.target * rate;
        g.saved = g.saved * rate;
        g.currency = 'RSD';
      }
    });
    d.bills.forEach(function(b){
      if(b.currency === 'EUR'){
        if(b.originalAmount === undefined){ b.originalAmount = b.amount; b.originalCurrency = 'EUR'; }
        b.amount = b.amount * rate;
        b.currency = 'RSD';
      }
    });
  }

  function loadState(){
    var d = defaultState();
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && typeof parsed === 'object'){
          if(Array.isArray(parsed.transactions)) d.transactions = parsed.transactions;
          if(Array.isArray(parsed.budgets)) d.budgets = parsed.budgets;
          if(Array.isArray(parsed.goals)) d.goals = parsed.goals;
          if(Array.isArray(parsed.bills)) d.bills = parsed.bills;
          if(parsed.categories){
            if(Array.isArray(parsed.categories.income)) d.categories.income = parsed.categories.income;
            if(Array.isArray(parsed.categories.expense)) d.categories.expense = parsed.categories.expense;
          }
          if(parsed.settings && typeof parsed.settings.eurRate === 'number' && parsed.settings.eurRate > 0){
            d.settings.eurRate = parsed.settings.eurRate;
          }
        }
      }
    }catch(e){
      console.error('Učitavanje podataka nije uspelo', e);
    }
    migrateToRSD(d, d.settings.eurRate);
    d.categories.income = mergeMissingDefaults(d.categories.income, DEFAULT_INCOME_CATS);
    d.categories.expense = mergeMissingDefaults(d.categories.expense, DEFAULT_EXPENSE_CATS);
    return d;
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error('Čuvanje podataka nije uspelo', e);
      toast('Greška pri čuvanju podataka na ovom uređaju.');
    }
  }

  var state = loadState();
  var ui = {
    tab:'pregled',
    overviewMonth: todayMonthKey(),
    txFilter:{ type:'all', q:'' }
  };
  var downloadsCap; // undefined = unresolved, null = unavailable

  // ---------- utils ----------
  function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function todayMonthKey(){ return todayISO().slice(0,7); }
  function monthKeyOf(iso){ return iso.slice(0,7); }
  function fmtDateDisplay(iso){
    var parts = iso.split('-');
    return parseInt(parts[2],10)+'.'+parseInt(parts[1],10)+'.'+parts[0]+'.';
  }
  var MONTH_NAMES = ['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
  function monthLabel(monthKey){
    var parts = monthKey.split('-').map(Number);
    return MONTH_NAMES[parts[1]-1] + ' ' + parts[0] + '.';
  }
  function shiftMonthKey(monthKey, delta){
    var parts = monthKey.split('-').map(Number), y = parts[0], m = parts[1];
    m += delta;
    while(m > 12){ m -= 12; y++; }
    while(m < 1){ m += 12; y--; }
    return y + '-' + pad2(m);
  }
  function daysInMonth(y, m){ return new Date(y, m, 0).getDate(); }
  function addMonthsClamped(iso, delta){
    var parts = iso.split('-').map(Number), y = parts[0], m = parts[1], d = parts[2];
    m += delta;
    while(m > 12){ m -= 12; y++; }
    while(m < 1){ m += 12; y--; }
    var dim = daysInMonth(y, m);
    d = Math.min(d, dim);
    return y + '-' + pad2(m) + '-' + pad2(d);
  }
  function daysUntil(iso){
    var now = new Date(); now.setHours(0,0,0,0);
    var parts = iso.split('-').map(Number);
    var due = new Date(parts[0], parts[1]-1, parts[2]);
    return Math.round((due - now) / 86400000);
  }
  function danaWord(n){ return n === 1 ? 'dan' : 'dana'; }
  function fmtAmount(n){
    var sign = n < 0 ? '-' : '';
    var abs = Math.abs(n);
    return sign + new Intl.NumberFormat('sr-RS', {minimumFractionDigits:2, maximumFractionDigits:2}).format(abs);
  }
  function fmtMoney(n, currency){ return fmtAmount(n) + ' ' + (currency === 'EUR' ? '€' : 'RSD'); }
  function toRSD(amount, currency){ return currency === 'EUR' ? amount * state.settings.eurRate : amount; }
  function wireConversionPreview(amountId, currencyId, previewId){
    function update(){
      var amtEl = document.getElementById(amountId), curEl = document.getElementById(currencyId), prev = document.getElementById(previewId);
      if(!amtEl || !curEl || !prev) return;
      var amt = parseFloat(amtEl.value);
      if(curEl.value === 'EUR' && amt > 0){
        prev.textContent = '≈ ' + fmtMoney(amt * state.settings.eurRate, 'RSD') + ' (kurs 1 € = ' + fmtAmount(state.settings.eurRate) + ' RSD)';
        prev.classList.remove('hidden');
      } else {
        prev.classList.add('hidden');
      }
    }
    document.getElementById(amountId).addEventListener('input', update);
    document.getElementById(currencyId).addEventListener('change', update);
    update();
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- derived data ----------
  function allTimeBalance(currency){
    return state.transactions.reduce(function(sum,t){
      if(t.currency !== currency) return sum;
      return sum + (t.type === 'income' ? t.amount : -t.amount);
    }, 0);
  }
  function monthTx(monthKey){
    return state.transactions.filter(function(t){ return monthKeyOf(t.date) === monthKey; });
  }
  function monthTotals(monthKey, currency){
    var txs = monthTx(monthKey).filter(function(t){ return t.currency === currency; });
    var income = txs.filter(function(t){ return t.type==='income'; }).reduce(function(s,t){ return s+t.amount; },0);
    var expense = txs.filter(function(t){ return t.type==='expense'; }).reduce(function(s,t){ return s+t.amount; },0);
    return { income:income, expense:expense, net: income-expense };
  }
  function categoryBreakdown(monthKey, currency){
    var txs = monthTx(monthKey).filter(function(t){ return t.currency===currency && t.type==='expense'; });
    var map = {};
    txs.forEach(function(t){ map[t.category] = (map[t.category]||0) + t.amount; });
    return Object.entries(map).sort(function(a,b){ return b[1]-a[1]; });
  }
  function budgetSpent(category, currency, monthKey){
    return monthTx(monthKey).filter(function(t){
      return t.type==='expense' && t.category===category && t.currency===currency;
    }).reduce(function(s,t){ return s+t.amount; },0);
  }
  function billStatus(b){
    if(b.recurrence==='once' && b.paid) return {key:'paid', label:'Plaćeno ✓'};
    var days = daysUntil(b.dueDate);
    if(days < 0) return {key:'overdue', label:'Kasni ' + Math.abs(days) + ' ' + danaWord(Math.abs(days))};
    if(days === 0) return {key:'soon', label:'Dospeva danas'};
    if(days <= 5) return {key:'soon', label:'Dospeva za ' + days + ' ' + danaWord(days)};
    return {key:'upcoming', label:'Za ' + days + ' ' + danaWord(days)};
  }

  // ---------- rendering ----------
  function render(){
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    var selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

    renderTabs();
    var content = document.getElementById('tabContent');
    if(ui.tab === 'pregled') content.innerHTML = renderPregled();
    else if(ui.tab === 'transakcije') content.innerHTML = renderTransakcije();
    else if(ui.tab === 'budzet') content.innerHTML = renderBudzet();
    else if(ui.tab === 'ciljevi') content.innerHTML = renderCiljevi();
    else if(ui.tab === 'racuni') content.innerHTML = renderRacuni();
    else if(ui.tab === 'podesavanja') content.innerHTML = renderPodesavanja();

    if(activeId){
      var el = document.getElementById(activeId);
      if(el){
        el.focus();
        if(selStart !== null && el.setSelectionRange){
          try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
        }
      }
    }

  function renderTransakcije(){
    var f = ui.txFilter;
    var list = state.transactions.slice();
    if(f.type !== 'all') list = list.filter(function(t){ return t.type===f.type; });
    if(f.q){
      var q = f.q.toLowerCase();
      list = list.filter(function(t){
        return t.category.toLowerCase().indexOf(q)>-1 || (t.note||'').toLowerCase().indexOf(q)>-1;
      });
    }
    list.sort(function(a,b){ return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); });

    var groups = [], curKey = null, curGroup = null;
    list.forEach(function(t){
      var mk = monthKeyOf(t.date);
      if(mk !== curKey){ curKey = mk; curGroup = {key:mk, items:[]}; groups.push(curGroup); }
      curGroup.items.push(t);
    });

    var filtersHtml =
      '<div class="filters">' +
        '<select data-action="filterType">' +
          '<option value="all"'+(f.type==='all'?' selected':'')+'>Sve</option>' +
          '<option value="income"'+(f.type==='income'?' selected':'')+'>Prihodi</option>' +
          '<option value="expense"'+(f.type==='expense'?' selected':'')+'>Rashodi</option>' +
        '</select>' +
        '<input type="text" id="txSearchInput" placeholder="Pretraga..." value="'+esc(f.q)+'" data-action="filterSearch">' +
      '</div>';

    var listHtml = groups.length ? groups.map(function(g){
      return '<div class="section-title">'+monthLabel(g.key)+'</div><div class="card">' +
        g.items.map(function(t){ return renderTxRow(t, false); }).join('') + '</div>';
    }).join('') : '<div class="empty">Nema transakcija koje odgovaraju pretrazi.</div>';

    return filtersHtml + listHtml;
  }

  function renderBudzet(){
    var mk = todayMonthKey();
    var body;
    if(state.budgets.length){
      body = state.budgets.map(function(b){
        var spent = budgetSpent(b.category, b.currency, mk);
        var pct = b.limit > 0 ? Math.round(spent/b.limit*100) : 0;
        var barPct = Math.min(100, pct);
        var cls = pct > 100 ? 'over' : (pct >= 80 ? 'warn' : '');
        var remaining = b.limit - spent;
        var remText = remaining >= 0
          ? ' · preostalo ' + fmtMoney(remaining, b.currency)
          : ' · prekoračeno ' + fmtMoney(Math.abs(remaining), b.currency);
        var origNote = b.originalCurrency ? ' (izvorno ' + fmtMoney(b.originalLimit,'EUR') + ')' : '';
        return (
          '<div class="card">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:.3rem;">' +
              '<strong>'+esc(b.category)+'</strong>' +
              '<button class="icon-btn" data-action="deleteBudget" data-id="'+b.id+'" title="Obriši">✕</button>' +
            '</div>' +
            '<div class="progress-track"><div class="progress-fill '+cls+'" style="width:'+barPct+'%"></div></div>' +
            '<div class="row-sub" style="margin-top:.35rem">'+fmtMoney(spent,b.currency)+' od '+fmtMoney(b.limit,b.currency)+origNote+remText+'</div>' +
          '</div>'
        );
      }).join('');
    } else {
      body = '<div class="empty">Još nema postavljenih budžeta.</div>';
    }
    return (
      '<div class="section-title" style="margin-top:0">Budžeti za '+monthLabel(mk)+'</div>' +
      '<button class="btn btn-block" data-action="openBudgetForm">+ Dodaj budžet</button>' +
      '<div style="margin-top:.9rem">'+body+'</div>'
    );
  }

  function renderCiljevi(){
    var body;
    if(state.goals.length){
      body = state.goals.map(function(g){
        var pct = g.target > 0 ? Math.min(100, Math.round(g.saved/g.target*100)) : 0;
        var remaining = Math.max(0, g.target - g.saved);
        var deadlineStr = '';
        if(g.deadline){
          var d = daysUntil(g.deadline);
          deadlineStr = d >= 0 ? ' · rok za ' + d + ' ' + danaWord(d) : ' · rok istekao pre ' + Math.abs(d) + ' ' + danaWord(Math.abs(d));
        }
        var progressNote = remaining > 0 ? ' · još ' + fmtMoney(remaining, g.currency) : ' · cilj ostvaren 🎉';
        var origNote = g.originalCurrency ? ' (izvorno ' + fmtMoney(g.originalTarget,'EUR') + ')' : '';
        return (
          '<div class="card">' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:.3rem;">' +
              '<strong>'+esc(g.name)+'</strong>' +
              '<button class="icon-btn" data-action="deleteGoal" data-id="'+g.id+'" title="Obriši">✕</button>' +
            '</div>' +
            '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
            '<div class="row-sub" style="margin-top:.35rem">'+fmtMoney(g.saved,g.currency)+' od '+fmtMoney(g.target,g.currency)+origNote+' ('+pct+'%)'+progressNote+deadlineStr+'</div>' +
            '<div style="display:flex;gap:.5rem;margin-top:.6rem;">' +
              '<button class="btn btn-sm" data-action="openGoalDeposit" data-id="'+g.id+'">Uplati</button>' +

  // ---------- forms ----------
  function openTxForm(existing){
    var type = existing ? existing.type : 'expense';
    var currency = existing ? (existing.originalCurrency || 'RSD') : 'RSD';
    var displayAmount = existing ? (existing.originalCurrency === 'EUR' ? existing.originalAmount : existing.amount) : '';
    var html =
      '<input type="hidden" id="txId" value="'+(existing?existing.id:'')+'">' +
      '<div class="form-group"><label>Tip</label><div class="seg" id="txTypeSeg">' +
        '<button type="button" class="'+(type==='income'?'active income':'')+'" data-val="income">Prihod</button>' +
        '<button type="button" class="'+(type==='expense'?'active expense':'')+'" data-val="expense">Rashod</button>' +
      '</div></div>' +
      '<div class="form-group"><label>Iznos</label><input type="number" id="txAmount" step="0.01" min="0.01" value="'+displayAmount+'"></div>' +
      '<div class="form-group"><label>Valuta</label><select id="txCurrency">' +
        '<option value="RSD"'+(currency==='RSD'?' selected':'')+'>RSD</option>' +
        '<option value="EUR"'+(currency==='EUR'?' selected':'')+'>EUR</option>' +
      '</select></div>' +
      '<div class="row-sub hidden" id="txConvertPreview" style="margin:-.5rem 0 .85rem;"></div>' +
      '<div class="form-group"><label>Kategorija</label><select id="txCategory"></select></div>' +
      '<div class="form-group hidden" id="newCatGroup"><label>Naziv nove kategorije</label><input type="text" id="newCatInput" placeholder="npr. Kućni ljubimci"></div>' +
      '<div class="form-group"><label>Datum</label><input type="date" id="txDate" value="'+(existing?existing.date:todayISO())+'"></div>' +
      '<div class="form-group"><label>Napomena (opciono)</label><input type="text" id="txNote" value="'+(existing?esc(existing.note||''):'')+'"></div>' +
      '<button class="btn btn-block" id="txSaveBtn">'+(existing?'Sačuvaj izmene':'Dodaj transakciju')+'</button>';

    openModal(existing ? 'Izmeni transakciju' : 'Nova transakcija', html);
    wireConversionPreview('txAmount','txCurrency','txConvertPreview');

    var curType = type;
    function fillCategories(){
      var sel = document.getElementById('txCategory');
      var list = state.categories[curType].slice();
      if(existing && curType === existing.type && list.indexOf(existing.category) === -1){
        list.unshift(existing.category);
      }
      sel.innerHTML = list.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('') +
        '<option value="__add__">+ Nova kategorija...</option>';
      if(existing && curType === existing.type) sel.value = existing.category;
    }
    fillCategories();

    var segBtns = document.querySelectorAll('#txTypeSeg button');
    segBtns.forEach(function(b){
      b.addEventListener('click', function(){
        curType = b.dataset.val;
        segBtns.forEach(function(x){ x.classList.remove('active','income','expense'); });
        b.classList.add('active', curType);
        fillCategories();
      });
    });

    document.getElementById('txCategory').addEventListener('change', function(e){
      document.getElementById('newCatGroup').classList.toggle('hidden', e.target.value !== '__add__');
    });

    document.getElementById('txSaveBtn').addEventListener('click', function(){
      var rawAmount = parseFloat(document.getElementById('txAmount').value);
      if(!rawAmount || rawAmount <= 0){ toast('Unesi ispravan iznos.'); return; }
      var currencyVal = document.getElementById('txCurrency').value;
      var category = document.getElementById('txCategory').value;
      var date = document.getElementById('txDate').value || todayISO();
      var note = document.getElementById('txNote').value.trim();
      if(category === '__add__'){
        var newCat = document.getElementById('newCatInput').value.trim();
        if(!newCat){ toast('Unesi naziv nove kategorije.'); return; }
        category = newCat;
        if(state.categories[curType].indexOf(category) === -1) state.categories[curType].push(category);
      }
      var amount = toRSD(rawAmount, currencyVal);
      var txData = {type:curType, amount:amount, currency:'RSD', category:category, date:date, note:note};
      if(currencyVal === 'EUR'){ txData.originalAmount = rawAmount; txData.originalCurrency = 'EUR'; }
      var id = document.getElementById('txId').value;
      if(id){
        var tx = state.transactions.find(function(t){ return t.id===id; });
        delete tx.originalAmount; delete tx.originalCurrency;
        Object.assign(tx, txData);
      } else {
        state.transactions.push(Object.assign({id:genId()}, txData));
      }
      saveState();
      closeModal();
      render();
      toast(id ? 'Transakcija ažurirana.' : 'Transakcija dodata.');
    });
  }

      toast('Budžet sačuvan.');

    });
    document.getElementById('glSaveBtn').addEventListener('click', function(){
      var name = document.getElementById('glName').value.trim();
      var rawTarget = parseFloat(document.getElementById('glTarget').value);
      var currencyVal = document.getElementById('glCurrency').value;
      var noDeadline = document.getElementById('glNoDeadline').checked;
      var deadline = noDeadline ? null : (document.getElementById('glDeadline').value || null);
      if(!name){ toast('Unesi naziv cilja.'); return; }
      if(!rawTarget || rawTarget <= 0){ toast('Unesi ispravan iznos.'); return; }
      var target = toRSD(rawTarget, currencyVal);
      var goal = {id:genId(), name:name, target:target, currency:'RSD', saved:0, deadline:deadline, createdAt:todayISO()};
      if(currencyVal === 'EUR'){ goal.originalTarget = rawTarget; goal.originalCurrency = 'EUR'; }
      state.goals.push(goal);
      saveState(); closeModal(); render();
      toast('Cilj dodat.');
    });
  }

  function openGoalMoneyForm(goalId, mode){
    var goal = state.goals.find(function(g){ return g.id===goalId; });
    if(!goal) return;
    var label = mode === 'deposit' ? 'Uplata u cilj' : 'Podizanje sa cilja';
    var html =
      '<p style="margin-top:0" class="row-sub">'+esc(goal.name)+' — trenutno '+fmtMoney(goal.saved,'RSD')+'</p>' +
      '<div class="form-group"><label>Iznos</label><input type="number" id="gmAmount" step="0.01" min="0.01"></div>' +
      '<div class="form-group"><label>Valuta</label><select id="gmCurrency"><option value="RSD" selected>RSD</option><option value="EUR">EUR</option></select></div>' +
      '<div class="row-sub hidden" id="gmPreview" style="margin:-.5rem 0 .85rem;"></div>' +
      '<button class="btn btn-block" id="gmSaveBtn">'+(mode==='deposit'?'Uplati':'Podigni')+'</button>';
    openModal(label, html);
    wireConversionPreview('gmAmount','gmCurrency','gmPreview');
    document.getElementById('gmSaveBtn').addEventListener('click', function(){
      var rawAmount = parseFloat(document.getElementById('gmAmount').value);
      if(!rawAmount || rawAmount <= 0){ toast('Unesi ispravan iznos.'); return; }
      var currencyVal = document.getElementById('gmCurrency').value;
      var amount = toRSD(rawAmount, currencyVal);
      if(mode === 'deposit'){
        goal.saved += amount;
        var tx = {id:genId(), type:'expense', amount:amount, currency:'RSD', category:'💰 Štednja', date:todayISO(), note:'Uplata za cilj: '+goal.name, meta:{goalId:goal.id}};
        if(currencyVal === 'EUR'){ tx.originalAmount = rawAmount; tx.originalCurrency = 'EUR'; }
        state.transactions.push(tx);
        toast('Uplata dodata.');
      } else {
        var withdrawAmt = Math.min(amount, goal.saved);
        goal.saved -= withdrawAmt;
        var tx2 = {id:genId(), type:'income', amount:withdrawAmt, currency:'RSD', category:'💰 Štednja', date:todayISO(), note:'Podizanje sa cilja: '+goal.name, meta:{goalId:goal.id}};
        if(currencyVal === 'EUR'){ tx2.originalAmount = rawAmount; tx2.originalCurrency = 'EUR'; }
        state.transactions.push(tx2);
        toast('Sredstva podignuta.');
      }
      saveState(); closeModal(); render();
    });
  }

  function openBillForm(){
    var html =
      '<div class="form-group"><label>Naziv računa</label><input type="text" id="blName" placeholder="npr. Struja"></div>' +
      '<div class="form-group"><label>Iznos</label><input type="number" id="blAmount" step="0.01" min="0.01"></div>' +
      '<div class="form-group"><label>Valuta</label><select id="blCurrency"><option value="RSD" selected>RSD</option><option value="EUR">EUR</option></select></div>' +
      '<div class="row-sub hidden" id="blPreview" style="margin:-.5rem 0 .85rem;"></div>' +
      '<div class="form-group"><label>Datum dospeća</label><input type="date" id="blDueDate" value="'+todayISO()+'"></div>' +
      '<div class="form-group"><label>Ponavljanje</label><select id="blRecurrence"><option value="once">Jednokratno</option><option value="monthly">Mesečno</option></select></div>' +
      '<button class="btn btn-block" id="blSaveBtn">Sačuvaj račun</button>';
    openModal('Novi račun', html);
    wireConversionPreview('blAmount','blCurrency','blPreview');
    document.getElementById('blSaveBtn').addEventListener('click', function(){
      var name = document.getElementById('blName').value.trim();
      var rawAmount = parseFloat(document.getElementById('blAmount').value);
      var currencyVal = document.getElementById('blCurrency').value;
      var dueDate = document.getElementById('blDueDate').value;
      var recurrence = document.getElementById('blRecurrence').value;
      if(!name){ toast('Unesi naziv računa.'); return; }
      if(!rawAmount || rawAmount <= 0){ toast('Unesi ispravan iznos.'); return; }
      if(!dueDate){ toast('Izaberi datum dospeća.'); return; }
      var amount = toRSD(rawAmount, currencyVal);
      var bill = {id:genId(), name:name, amount:amount, currency:'RSD', dueDate:dueDate, recurrence:recurrence, paid:false, lastPaidDate:null};
      if(currencyVal === 'EUR'){ bill.originalAmount = rawAmount; bill.originalCurrency = 'EUR'; }
      state.bills.push(bill);
      saveState(); closeModal(); render();
      toast('Račun dodat.');
    });
  }

  function markBillPaid(billId){
    var bill = state.bills.find(function(b){ return b.id===billId; });
    if(!bill) return;
    state.transactions.push({id:genId(), type:'expense', amount:bill.amount, currency:bill.currency, category:'🧾 Računi', date:todayISO(), note:'Plaćeno: '+bill.name, meta:{billId:bill.id}});
    if(bill.recurrence === 'monthly'){
      bill.dueDate = addMonthsClamped(bill.dueDate, 1);
      bill.paid = false;
      bill.lastPaidDate = todayISO();
    } else {
      bill.paid = true;
      bill.lastPaidDate = todayISO();
    }
    saveState(); render();
    toast('Račun označen kao plaćen.');
  }

  // ---------- export / import ----------
  async function getDownloads(){
    if(downloadsCap !== undefined) return downloadsCap;
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        downloadsCap = await window.claude.use('downloads');
      } else {
        downloadsCap = null;
      }
    }catch(e){
      downloadsCap = null;
    }
    return downloadsCap;
  }
  function handleDownloadError(e){
    var code = e && e.code;
    if(code === 'declined') toast('Čuvanje otkazano.');
    else if(code === 'rate_limited') toast('Sačekaj trenutak i pokušaj ponovo.');
    else toast('Izvoz trenutno nije moguć.');
  }
  function browserDownload(filename, data, mime){
    try{
      var blob = new Blob([data], {type: mime || 'text/plain;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    }catch(e){
      return false;
    }
  }
  async function saveFile(filename, data, mime){
    var dl = await getDownloads();
    if(dl){
      try{
        await dl.save({filename:filename, data:data});
        return true;
      }catch(e){
        handleDownloadError(e);
        return false;
      }
    }
    var ok = browserDownload(filename, data, mime);
    if(!ok) toast('Izvoz trenutno nije moguć u ovom prikazu.');
    return ok;
  }
  function csvEscape(v){
    var s = String(v);
    if(/[",\r\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  async function exportCSV(){
    if(state.transactions.length === 0){ toast('Nema transakcija za izvoz.'); return; }
    var rows = [['Datum','Tip','Kategorija','Iznos (RSD)','Napomena','Izvorni iznos','Izvorna valuta']];
    state.transactions.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(t){
      rows.push([t.date, t.type==='income'?'Prihod':'Rashod', t.category, t.amount.toFixed(2), t.note||'', t.originalCurrency?t.originalAmount.toFixed(2):'', t.originalCurrency||'']);
    });
    var csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var ok = await saveFile('dzep-transakcije-'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8');
    if(ok) toast('CSV fajl je izvezen.');
  }
  async function exportJSON(){
    var data = JSON.stringify(state, null, 2);
    var ok = await saveFile('dzep-backup-'+todayISO()+'.json', data, 'application/json;charset=utf-8');
    if(ok) toast('Rezervna kopija je izvezena.');
  }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.transactions)) throw new Error('bad shape');
        confirmAndDo('Ovo će zameniti sve trenutne podatke uvezenom rezervnom kopijom. Da li si siguran/na?', function(){
          var d = defaultState();
          if(Array.isArray(parsed.transactions)) d.transactions = parsed.transactions;
          if(Array.isArray(parsed.budgets)) d.budgets = parsed.budgets;
          if(Array.isArray(parsed.goals)) d.goals = parsed.goals;
          if(Array.isArray(parsed.bills)) d.bills = parsed.bills;
          if(parsed.categories){
            if(Array.isArray(parsed.categories.income)) d.categories.income = parsed.categories.income;
            if(Array.isArray(parsed.categories.expense)) d.categories.expense = parsed.categories.expense;
          }
          if(parsed.settings && typeof parsed.settings.eurRate === 'number' && parsed.settings.eurRate > 0){
            d.settings.eurRate = parsed.settings.eurRate;
          }
          migrateToRSD(d, d.settings.eurRate);
          d.categories.income = mergeMissingDefaults(d.categories.income, DEFAULT_INCOME_CATS);
          d.categories.expense = mergeMissingDefaults(d.categories.expense, DEFAULT_EXPENSE_CATS);
          state = d;
          saveState(); render();
          toast('Podaci su uvezeni.');
        });
      }catch(e){
        toast('Fajl nije validna rezervna kopija.');
      }
    };
    reader.readAsText(file);
  }

  // ---------- toast ----------
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  // ---------- event delegation ----------
  function onRootClick(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = btn.dataset.action;
    if(action === 'setTab'){ ui.tab = btn.dataset.tab; render(); }
    else if(action === 'monthPrev'){ ui.overviewMonth = shiftMonthKey(ui.overviewMonth,-1); render(); }
    else if(action === 'monthNext'){ ui.overviewMonth = shiftMonthKey(ui.overviewMonth,1); render(); }
    else if(action === 'editTx'){ openTxForm(state.transactions.find(function(t){ return t.id===btn.dataset.id; })); }
    else if(action === 'deleteTx'){
      confirmAndDo('Obrisati ovu transakciju?', function(){
        state.transactions = state.transactions.filter(function(t){ return t.id!==btn.dataset.id; });
        saveState(); render(); toast('Transakcija obrisana.');
      });
    }
    else if(action === 'openBudgetForm'){ openBudgetForm(); }
    else if(action === 'deleteBudget'){
      confirmAndDo('Obrisati ovaj budžet?', function(){
        state.budgets = state.budgets.filter(function(b){ return b.id!==btn.dataset.id; });
        saveState(); render(); toast('Budžet obrisan.');
      });
    }
    else if(action === 'openGoalForm'){ openGoalForm(); }
    else if(action === 'deleteGoal'){
      confirmAndDo('Obrisati ovaj cilj?', function(){
        state.goals = state.goals.filter(function(g){ return g.id!==btn.dataset.id; });
        saveState(); render(); toast('Cilj obrisan.');
      });
    }
    else if(action === 'openGoalDeposit'){ openGoalMoneyForm(btn.dataset.id, 'deposit'); }
    else if(action === 'openGoalWithdraw'){ openGoalMoneyForm(btn.dataset.id, 'withdraw'); }
    else if(action === 'openBillForm'){ openBillForm(); }
    else if(action === 'payBill'){
      confirmAndDo('Označiti ovaj račun kao plaćen? Ovo će dodati rashod u transakcije.', function(){
        markBillPaid(btn.dataset.id);
      });
    }
    else if(action === 'deleteBill'){
      confirmAndDo('Obrisati ovaj račun?', function(){
        state.bills = state.bills.filter(function(b){ return b.id!==btn.dataset.id; });
        saveState(); render(); toast('Račun obrisan.');
      });
    }
    else if(action === 'exportCsv'){ exportCSV(); }
    else if(action === 'exportJson'){ exportJSON(); }
    else if(action === 'deleteCategory'){
      confirmAndDo('Obrisati ovu kategoriju?', function(){
        var t = btn.dataset.type;
        state.categories[t] = state.categories[t].filter(function(c){ return c!==btn.dataset.cat; });
        saveState(); render(); toast('Kategorija obrisana.');
      });
    }
    else if(action === 'resetAll'){
      confirmAndDo('Ovo trajno briše SVE podatke (transakcije, budžete, ciljeve, račune). Da li si siguran/na?', function(){
        state = defaultState();
        saveState(); render(); toast('Svi podaci su obrisani.');
      });
    }
    else if(action === 'cancelConfirm'){ closeModal(); }
  }

  function init(){
    var app = document.getElementById('app');
    app.addEventListener('click', onRootClick);
    app.addEventListener('change', function(e){
      var el = e.target.closest('[data-action]');
      if(el){
        if(el.dataset.action === 'filterType'){ ui.txFilter.type = el.value; render(); return; }
        if(el.dataset.action === 'setEurRate'){
          var rate = parseFloat(el.value);
          if(!rate || rate <= 0){ toast('Unesi ispravan kurs.'); render(); return; }
          state.settings.eurRate = rate;
          saveState();
          toast('Kurs ažuriran: 1 € = ' + fmtAmount(rate) + ' RSD.');
          render();
          return;
        }
      }
      if(e.target.id === 'importFileInput'){
        var file = e.target.files[0];
        if(file) handleImportFile(file);
        e.target.value = '';
      }
    });
    app.addEventListener('input', function(e){
      var el = e.target.closest('[data-action="filterSearch"]');
      if(el){ ui.txFilter.q = el.value; render(); }
    });
    document.getElementById('fabBtn').addEventListener('click', function(){ openTxForm(null); });
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function(e){
      if(e.target.id === 'modalOverlay') closeModal();
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closeModal();
    });
    render();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
